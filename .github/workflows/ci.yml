name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      # Release-gate guard (#251): package.json + CHANGELOG version strings
      # must be valid SemVer. Runs before install — it needs no deps, and a
      # bad version should fail in seconds, not after a full build.
      - run: node scripts/check-version.mjs
      # v0.7.0: vitest replaces node:test; needs install before npm test.
      - run: npm ci
      - run: npm run build
      - run: npm test
      # SPEC §6.6 conformance fixtures (byte-identical release-gate). Runs
      # after build so scripts/fixture-check.mjs can import from dist/.
      - run: npm run test:fixtures

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      # v0.7.0: install + build so the template renderer (which imports from
      # dist/core/) can resolve modules. Previously imported from lib/render.js
      # and lib/prompts.js, but Phase 2 moved both under src/core/ → dist/core/.
      - run: npm ci
      - run: npm run build
      - name: Render templates with placeholder values
        run: |
          mkdir -p .ci-rendered
          # v0.6.22 / 0.0.O: render via the real renderer so REVIEW_SCHEMA +
          # CLUD_BUG_VERSION + REVIEW_PROMPT substitutions land. Previously
          # only PROJECT_DESCRIPTION + LANGUAGE_HINTS were sed-substituted;
          # the new {{REVIEW_SCHEMA}} and {{CLUD_BUG_VERSION}} placeholders
          # leaked literal {{...}} braces into shell run blocks and SC1083'd
          # actionlint. The renderer matches what clud-bug init produces.
          for tmpl in templates/workflow*.yml.tmpl; do
            tmpl_name=$(basename "$tmpl")
            out=".ci-rendered/${tmpl_name%.tmpl}"
            node -e "
              import('./dist/core/render.js').then(async ({renderFile, templateLanguage}) => {
                const {reviewPrompt} = await import('./dist/core/prompts.js');
                const out = await renderFile('$tmpl', {
                  REVIEW_PROMPT: reviewPrompt({
                    projectDescription: 'A test project.',
                    language: templateLanguage('$tmpl_name'),
                  }),
                });
                process.stdout.write(out);
              });
            " > "$out"
          done
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version
      - name: Lint templates
        run: ./actionlint .ci-rendered/*.yml
      - name: Lint own workflows
        # Scoped to clud-bug-owned workflows only. Logmind-installed workflows
        # (check-decisions, check-doc-links, logmind-aggregate) are managed
        # upstream by the logmind tool — file shellcheck issues against
        # thrillmade/logmind, not here.
        run: |
          # PR #170 (2026-06-17 stop-the-bleed) deleted clud-bug-review.yml +
          # claude-code-review.yml — they consumed ANTHROPIC_API_KEY directly
          # and double-billed alongside the hosted App's AI Gateway path. Removed
          # from this lint list. clud-bug-audit.yml is on consumer repos only;
          # never lived in clud-bug itself.
          #
          # #291: .github/actions/strict-mode-gate/action.yml is checked into
          # this repo but was reachable by NEITHER actionlint path. Passed
          # directly, actionlint expects a workflow (`jobs:`/`on:`) and fails
          # on schema before it reads the action's own content at all —
          # confirmed against actionlint v1.7.12: `./actionlint
          # .github/actions/strict-mode-gate/action.yml` errors `"jobs"
          # section is missing`. And per actionlint's own docs, it reads a
          # local action's metadata (required/unknown `with:` inputs,
          # `name`/`description`/`runs.using`) only when a workflow reaches
          # it through a LOCAL `uses: ./...` step — a REMOTE ref (what the
          # shipped templates use: `thrillmade/clud-bug/...@vX`) resolves
          # from actionlint's bundled popular-actions data, never this
          # repo's own file. Nothing in this repo had a local `uses:` of it,
          # so the composite's metadata had never actually been linted here.
          # This manufactures exactly that reference — a throwaway workflow
          # that exists only so actionlint has one to read — and lints it.
          # actionlint does NOT check a composite action's `run:` steps this
          # way (confirmed empirically: a deliberately broken `run:` body
          # produced zero findings through this same local-uses route); the
          # base-ref guards inside strict-mode-gate/action.yml are covered
          # by test/strict-mode-gate-base-ref.test.js instead, not by this.
          node -e "
            require('fs').writeFileSync('.ci-rendered/strict-mode-gate-probe.yml', [
              'name: strict-mode-gate metadata probe (generated by ci.yml — not a real workflow)',
              'on: push',
              'jobs:',
              '  probe:',
              '    runs-on: ubuntu-latest',
              '    steps:',
              '      - uses: ./.github/actions/strict-mode-gate',
              '        with:',
              '          github-token: lint-only-placeholder',
              '',
            ].join('\n'));
          "
          for wf in .github/workflows/ci.yml \
                    .ci-rendered/strict-mode-gate-probe.yml; do
            if [ -f "$wf" ]; then ./actionlint "$wf"; fi
          done
